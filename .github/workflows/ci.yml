name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            ml/requirements.txt
      - run: pip install -r services/api/requirements.txt -r ml/requirements.txt pytest
      - run: pytest -q
      # Pinned so a new Helm release cannot change lint results unexpectedly.
      - uses: azure/setup-helm@v5
        with: {version: v3.16.4}
      - run: helm lint helm/athena

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, model_server, ai_service, monitor, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: |
          svc="${{ matrix.service }}"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/athena-${svc//_/-}" >> "$GITHUB_OUTPUT"
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
