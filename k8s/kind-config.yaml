# Local cluster for development and the demo.
#   kind create cluster --name athena --config k8s/kind-config.yaml
# Change hostPath to the ABSOLUTE path of ml/artifacts on your machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /CHANGE/ME/Project-Athena/ml/artifacts
        containerPath: /athena-artifacts
