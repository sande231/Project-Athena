<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athena · Demo store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><strong>Athena</strong><a href="owner.html">Owner View</a><a href="engineer.html">Engineer</a><a class="active" href="store.html">Demo store</a></nav>
<main>
  <h1>Demo store checkout</h1>
  <p class="sub">Acts as the store plugin: each purchase is sent to Athena. For bulk traffic and the attack, run <code>scripts/stream_transactions.py</code>.</p>
  <div class="card" style="max-width:480px">
    <label>Amount (USD)</label><input id="amt" type="number" value="59.99" step="0.01">
    <label>Email domain</label><input id="email" value="gmail.com">
    <label>Device</label><select id="device"><option>desktop</option><option>mobile</option></select>
    <label>Card type</label><select id="card"><option>visa</option><option>mastercard</option><option>american express</option></select>
    <div style="margin-top:16px"><button onclick="buy()">Buy now</button></div>
    <div id="result" style="margin-top:16px"></div>
  </div>
</main>
<script>
async function buy() {
  const tx = {
    TransactionID: Date.now(), TransactionDT: Math.floor(Date.now() / 1000) % 15000000,
    TransactionAmt: Number(document.getElementById("amt").value), ProductCD: "W",
    P_emaildomain: document.getElementById("email").value, DeviceType: document.getElementById("device").value,
    card4: document.getElementById("card").value, card6: "debit"
  };
  const r = await fetch("/api/transactions", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({order_id: "WEB-" + tx.TransactionID, transaction: tx})}).then(r => r.json());
  document.getElementById("result").innerHTML = r.error ? `<span class="tag block">${r.error}</span>` :
    `<span class="tag ${r.decision}">${r.decision}</span> score ${r.score} · ${r.latency_ms} ms
     ${r.reason ? `<div class="sub" style="margin-top:6px">${r.reason}</div>` : ""}`;
}
</script>
</body>
</html>
