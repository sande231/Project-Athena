<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athena · Engineer dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<nav id="nav"></nav>
<main>
  <div class="row between">
    <h1>Model health</h1>
    <span class="row"><a id="grafana" class="button ghost" target="_blank" rel="noopener" hidden>Open Grafana</a>
      <button id="retrain">Retrain model</button></span>
  </div>
  <p class="sub">Live numbers from athena-api, refreshed every 5 seconds. Charts cover the time this page has been open.</p>
  <div id="retrain-msg" class="msg"></div>
  <div class="stats">
    <div class="stat"><b id="m-orders">–</b><span>Orders scored</span></div>
    <div class="stat"><b id="m-flag">–</b><span>Flag rate (review + block)</span></div>
    <div class="stat"><b id="m-lat">–</b><span>Avg latency (ms)</span></div>
    <div class="stat"><b id="m-prec">–</b><span>Precision (labelled orders)</span></div>
    <div class="stat"><b id="m-rec">–</b><span>Recall (labelled orders)</span></div>
  </div>
  <div class="grid-2">
    <div class="card"><div id="chart-flag" style="height:240px"></div></div>
    <div class="card"><div id="chart-volume" style="height:240px"></div></div>
  </div>
  <div class="card"><div id="chart-latency" style="height:220px"></div></div>
  <div class="card">
    <div class="row between"><h2>Latest alerts</h2><a class="muted" href="alerts.html">All alerts →</a></div>
    <div id="alerts"><p class="muted">No alerts.</p></div>
  </div>
</main>
<script src="common.js"></script>
<script>
const hist = {t: [], flag: [], latency: [], newOrders: []};
let lastOrders = null;
const layout = title => ({margin: {t: 34, l: 44, r: 10, b: 30}, title: {text: title, font: {size: 14}}, showlegend: false});
const config = {displayModeBar: false, responsive: true};

if (GRAFANA_URL) {
  const g = document.getElementById("grafana");
  g.href = GRAFANA_URL;
  g.hidden = false;
}

document.getElementById("retrain").addEventListener("click", async () => {
  try {
    const r = await api("/api/retrain", {method: "POST"});
    flash("retrain-msg", `Retraining ${r.status}. ${r.note || ""}`);
  } catch (err) {
    flash("retrain-msg", "Couldn't start retraining: " + err.message, true);
  }
});

const labelled = v => v == null ? '<span class="muted" style="font-size:14px">Not enough labels yet</span>' : pct(v);

async function load() {
  const [s, alerts] = await Promise.all([api("/api/metrics/summary"), api("/api/alerts")]);

  document.getElementById("m-orders").textContent = s.orders;
  document.getElementById("m-flag").textContent = pct(s.flag_rate) ?? "–";
  document.getElementById("m-lat").textContent = s.avg_latency_ms;
  document.getElementById("m-prec").innerHTML = labelled(s.precision);
  document.getElementById("m-rec").innerHTML = labelled(s.recall);

  hist.t.push(new Date());
  hist.flag.push(s.flag_rate * 100);
  hist.latency.push(s.avg_latency_ms);
  hist.newOrders.push(lastOrders == null ? 0 : Math.max(0, s.orders - lastOrders));
  lastOrders = s.orders;

  Plotly.react("chart-flag", [{x: hist.t, y: hist.flag, mode: "lines"}], layout("Flag rate (%)"), config);
  Plotly.react("chart-volume", [{x: hist.t, y: hist.newOrders, type: "bar"}], layout("New orders per 5 seconds"), config);
  Plotly.react("chart-latency", [{x: hist.t, y: hist.latency, mode: "lines"}], layout("Average latency (ms)"), config);

  if (alerts.length) {
    document.getElementById("alerts").innerHTML = alerts.slice(0, 3).map(a => {
      const sev = ["info", "warning", "critical"].includes(a.severity) ? a.severity : "warning";
      return `<div class="alert ${sev}">
        <span class="tag ${sev}">${SEVERITY_WORDS[sev]}</span> <b>${esc(a.type)}</b>
        <span class="muted">${dateTime(a.created_at)}</span>
        <div>${esc((a.explanation || {}).summary || "")}</div>
      </div>`;
    }).join("");
  }
}
poll(load, 5000);
</script>
</body>
</html>
