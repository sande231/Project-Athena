<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athena · Owner View</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<main>
  <h1>Your orders</h1>
  <p class="sub">Every order is checked for fraud. Yellow ones need a quick look; red ones were stopped.</p>
  <div class="stats">
    <div class="stat"><b id="s-orders">0</b><span>Orders checked</span></div>
    <div class="stat"><b id="s-approved">0</b><span>Approved</span></div>
    <div class="stat"><b id="s-review">0</b><span>Need a look</span></div>
    <div class="stat"><b id="s-blocked">0</b><span>Blocked</span></div>
    <div class="stat"><b id="s-saved">$0.00</b><span>Fraud stopped (blocked orders)</span></div>
  </div>
  <div class="columns">
    <div class="col"><h2><span class="tag approve">Approved</span></h2><div id="approve"></div></div>
    <div class="col">
      <h2 class="row between"><span class="tag review">Needs review</span><a class="muted" href="review.html">Review these →</a></h2>
      <div id="review"></div>
    </div>
    <div class="col"><h2><span class="tag block">Blocked</span></h2><div id="block"></div></div>
  </div>
</main>
<script src="common.js"></script>
<script>
function render(order) {
  const label = order.label ? `<div class="meta">Checked by your team: ${order.label === "fraud" ? "fraud" : "genuine"}</div>` : "";
  return `<div class="order">
    <b>${money(order.amount)}</b> · Order ${esc(order.order_id || order.id)}
    <div class="meta">${clock(order.created_at)}</div>
    ${order.reason ? `<div class="reason">${esc(order.reason)}</div>` : ""}
    ${label}
  </div>`;
}

async function load() {
  const [summary, orders, blocked] = await Promise.all([
    api("/api/metrics/summary"),
    api("/api/transactions?limit=60"),
    api("/api/transactions?decision=block&limit=1000"),
  ]);
  document.getElementById("s-orders").textContent = summary.orders;
  document.getElementById("s-approved").textContent = summary.approved;
  document.getElementById("s-review").textContent = summary.review;
  document.getElementById("s-blocked").textContent = summary.blocked;
  document.getElementById("s-saved").textContent = money(blocked.reduce((sum, o) => sum + (o.amount || 0), 0));

  for (const d of ["approve", "review", "block"]) {
    document.getElementById(d).innerHTML =
      orders.filter(o => o.decision === d).slice(0, 15).map(render).join("") ||
      '<div class="reason">Nothing here yet.</div>';
  }
}
poll(load, 5000);
</script>
</body>
</html>
