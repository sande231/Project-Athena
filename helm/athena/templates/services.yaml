{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {app: {{ $name }}, part-of: athena}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels: {app: {{ $name }}, part-of: athena}
    spec:
      serviceAccountName: athena
      {{- if $svc.usesDatabase }}
      # Wait until postgres accepts connections, so the app does not crash-loop on startup.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U {{ $.Values.postgres.user }}; do echo waiting for postgres; sleep 2; done"]
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.imageRegistry }}{{ $svc.image }}:{{ $.Values.imageTag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- if $svc.port }}
          ports: [{containerPort: {{ $svc.port }}, name: http}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- end }}
          {{- with $svc.preStopSleep }}
          # Keep serving for a few seconds after deletion starts, so the Service stops
          # routing new requests here before gunicorn shuts down (no failed requests).
          lifecycle:
            preStop:
              exec: {command: ["sleep", "{{ . }}"]}
          {{- end }}
          env:
            {{- range $k, $v := $svc.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
            {{- if $svc.usesDatabase }}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: athena-secrets, key: DB_PASSWORD}}
            - name: DATABASE_URL
              value: "postgresql+psycopg2://{{ $.Values.postgres.user }}:$(DB_PASSWORD)@postgres:5432/{{ $.Values.postgres.database }}"
            {{- end }}
            {{- if $svc.usesAnthropic }}
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: athena-secrets, key: ANTHROPIC_API_KEY}}
            {{- end }}
          {{- with $svc.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $svc.mountArtifacts }}
          volumeMounts: [{name: artifacts, mountPath: /artifacts, readOnly: true}]
          {{- end }}
      {{- if $svc.mountArtifacts }}
      volumes:
        - name: artifacts
          hostPath: {path: {{ $.Values.artifactsHostPath }}, type: Directory}
      {{- end }}
{{- if $svc.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  {{- /* metrics defaults to on; only an explicit "metrics: false" turns it off */}}
  labels: {app: {{ $name }}, part-of: athena{{ if ne $svc.metrics false }}, metrics: enabled{{ end }}}
spec:
  selector: {app: {{ $name }}}
  ports: [{name: http, port: {{ $svc.port }}, targetPort: http}]
{{- end }}
{{- if $svc.autoscale }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}}
  minReplicas: {{ $svc.autoscale.min }}
  maxReplicas: {{ $svc.autoscale.max }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ $svc.autoscale.cpuPercent }}}}
  {{- with $svc.autoscale.scaleDownSeconds }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: {{ . }}}
  {{- end }}
{{- end }}
{{- end }}
