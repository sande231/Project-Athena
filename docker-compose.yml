# Local development: runs the whole system without Kubernetes.
#   cp .env.example .env      (optional: add your ANTHROPIC_API_KEY)
#   docker compose up --build
# Then open http://localhost:8080 (set WEB_PORT to use a different host port)
#
# Health checks call each service's /healthz with Python's urllib, because the
# slim Python images do not include curl.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena"]
      interval: 5s
      retries: 10

  model-server:
    build: {context: ., dockerfile: services/model_server/Dockerfile}
    environment:
      MODEL_PATH: /artifacts/model.joblib
    volumes: [./ml/artifacts:/artifacts:ro]
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-service:
    build: {context: ., dockerfile: services/ai_service/Dockerfile}
    # .env is optional: without it ai-service uses its rule-based fallback.
    env_file:
      - path: .env
        required: false
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: {context: ., dockerfile: services/api/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg2://athena:athena@postgres:5432/athena
      MODEL_URL: http://model-server:8001
      AI_URL: http://ai-service:8002
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  monitor:
    build: {context: ., dockerfile: services/monitor/Dockerfile}
    environment:
      API_URL: http://api:8000
      AI_URL: http://ai-service:8002
      REFERENCE_PATH: /artifacts/reference_stats.json
      CHECK_INTERVAL: "30"
    volumes: [./ml/artifacts:/artifacts:ro]
    depends_on:
      api: {condition: service_healthy}

  web:
    build: {context: ., dockerfile: services/web/Dockerfile}
    environment:
      API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["${WEB_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
